<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MysteryAI{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Styles personnalisés -->
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
        }
    </style>
    
    <!-- Scripts principaux -->
    <script src="{{ url_for('static', filename='js/controllers/index.js') }}" type="module"></script>
    <script src="{{ url_for('static', filename='js/plugin_golden_layout_integration.js') }}"></script>
    
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <!-- Barre de navigation -->
    <nav class="bg-gray-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <a href="{{ url_for('main.index') }}" class="text-xl font-bold text-blue-400">
                        <i class="fas fa-map-marked-alt mr-2"></i>MysteryAI
                    </a>
                    
                    <div class="ml-10 hidden md:flex space-x-6">
                        <a href="{{ url_for('zones.zones_page') }}" class="hover:text-blue-400 transition-colors">
                            <i class="fas fa-map mr-1"></i>Zones
                        </a>
                        <a href="{{ url_for('geocaches.geocaches_page') }}" class="hover:text-blue-400 transition-colors">
                            <i class="fas fa-search-location mr-1"></i>Géocaches
                        </a>
                        <a href="{{ url_for('settings.settings_page') }}" class="hover:text-blue-400 transition-colors">
                            <i class="fas fa-cog mr-1"></i>Paramètres
                        </a>
                        <!-- Autres liens de navigation -->
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Boutons d'action ou menu utilisateur -->
                    <a href="#" class="hover:text-blue-400 transition-colors">
                        <i class="fas fa-cog"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Contenu principal -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Pied de page -->
    <footer class="bg-gray-900 text-gray-400 py-6 mt-12">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <p>&copy; 2024 MysteryAI. Tous droits réservés.</p>
                </div>
                <div class="flex space-x-4">
                    <a href="#" class="hover:text-blue-400 transition-colors">
                        <i class="fas fa-question-circle mr-1"></i>Aide
                    </a>
                    <a href="#" class="hover:text-blue-400 transition-colors">
                        <i class="fas fa-info-circle mr-1"></i>À propos
                    </a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Scripts JavaScript -->
    {% block scripts %}
        <!-- Scripts existants -->
        <script src="{{ url_for('static', filename='js/layout_state_manager.js') }}"></script>
        <script src="{{ url_for('static', filename='js/layout_initialize.js') }}"></script>
        <script src="{{ url_for('static', filename='js/plugin_golden_layout_integration.js') }}"></script>
        
        <!-- Client Socket.IO et service WebSocket global -->
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-VC7x6qBP7tRr1x4p7H1nGm9y5O2h+S0m7vNQ1GkQ0Fv7v7Hk9d0YVQG6L7G8e2eE" crossorigin="anonymous"></script>
        <script src="{{ url_for('static', filename='js/services/websocket_service.js') }}"></script>
        
        <!-- Nouveau système de TabOpener -->
        <script src="{{ url_for('static', filename='js/services/tab_opener_service.js') }}"></script>
        <script src="{{ url_for('static', filename='js/layout_tab_opener_integration.js') }}"></script>
        
        <!-- Autres scripts spécifiques à la page -->
        {% block page_scripts %}{% endblock %}
    {% endblock %}

    <!-- Overlay global des notifications -->
    <div id="notifications-root" aria-live="polite" aria-atomic="true" style="position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px;"></div>
    <style>
        .toast { min-width: 260px; max-width: 420px; padding: 10px 12px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); display:flex; align-items:flex-start; gap:8px; border:1px solid rgba(255,255,255,.08); background: #1f2937; color:#e5e7eb; }
        .toast .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 9999px; overflow: hidden; margin-top: 6px; }
        .toast .bar > div { height: 100%; width: 0%; transition: width .2s ease; border-radius: 9999px; }
        .toast.info { border-color: rgba(59,130,246,.4); background: rgba(59,130,246,.15); }
        .toast.success { border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.15); }
        .toast.warning { border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.15); }
        .toast.error { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.15); }
        .toast .title { font-weight: 600; margin-bottom: 2px; }
        .toast .close { margin-left:auto; opacity:.7; cursor:pointer; }
    </style>
    <script>
    window.AppNotify = (() => {
      const root = document.getElementById('notifications-root');
      const items = new Map();

      function ensureElement(notification) {
        let el = document.getElementById(`ntf-${notification.id}`);
        if (!el) {
          el = document.createElement('div');
          el.id = `ntf-${notification.id}`;
          el.className = `toast ${notification.level||'info'}`;
          root.appendChild(el);
        } else {
          el.className = `toast ${notification.level||'info'}`;
        }

        const titleHtml = notification.title ? `<div class="title">${notification.title}</div>` : '';
        const msgHtml = notification.html || `<div>${notification.message||''}</div>`;
        const progressHtml = notification.progress ? `<div class="bar"><div style="width:${Math.max(0, Math.min(1, notification.progress.pct||0))*100}%; background:${levelColor(notification.level)}"></div></div>` : '';
        const actionsHtml = (notification.actions||[]).map(a => `<button data-act-id="${a.id}" class="px-2 py-1 text-xs bg-gray-700 hover:bg-gray-600 rounded">${a.label}</button>`).join('');

        el.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:2px; width:100%">
            ${titleHtml}
            ${msgHtml}
            ${progressHtml}
            ${actionsHtml ? `<div style="margin-top:4px; display:flex; gap:6px">${actionsHtml}</div>` : ''}
          </div>
          <span class="close" aria-label="Fermer" onclick="AppNotify.remove('${notification.id}')">✕</span>
        `;

        if (notification.actions) {
          notification.actions.forEach(a => {
            const btn = el.querySelector(`[data-act-id="${a.id}"]`);
            if (btn && typeof a.onClick === 'function') {
              btn.onclick = () => a.onClick(notification.id);
            }
          });
        }
        return el;
      }

      function levelColor(level) {
        switch(level) {
          case 'success': return 'rgb(16 185 129)';
          case 'warning': return 'rgb(245 158 11)';
          case 'error': return 'rgb(239 68 68)';
          default: return 'rgb(59 130 246)';
        }
      }

      function push(payload) {
        const n = { id: payload.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random())), type:'toast', level:'info', ttl: 5000, ...payload };
        items.set(n.id, n);
        ensureElement(n);
        if (n.ttl && !n.progress) {
          setTimeout(() => remove(n.id), n.ttl);
        }
        return n.id;
      }

      function update(id, patch) {
        const prev = items.get(id) || { id };
        const n = { ...prev, ...patch };
        items.set(id, n);
        ensureElement(n);
      }

      function remove(id) {
        items.delete(id);
        const el = document.getElementById(`ntf-${id}`);
        if (el) el.remove();
      }

      // Intégration HTMX si besoin via CustomEvent
      document.addEventListener('app:notify', (e) => push(e.detail), true);

      // Intégration WebSocket (le projet peut brancher window.handleWsMessage)
      window.handleWsMessage = (msg) => {
        if (msg && msg.kind === 'notification') {
          if (msg.id && items.has(msg.id)) update(msg.id, msg); else push(msg);
        }
      };

      return { push, update, remove };
    })();
    </script>
    <!-- Script d'initialisation de GoldenLayout -->
    <script>
        // Initialiser l'intégration des plugins avec GoldenLayout
        document.addEventListener('DOMContentLoaded', function() {
            // Si GoldenLayout est initialisé
            if (window.goldenLayout) {
                // Enregistrer le composant plugin-interface
                window.PluginGoldenLayoutIntegration.registerPluginInterfaceComponent(window.goldenLayout);
                console.log("Intégration des plugins avec GoldenLayout initialisée");
            } else {
                console.warn("GoldenLayout n'est pas disponible");
            }
            
            // S'assurer que le contrôleur PluginInterface est globalement disponible
            if (window.StimulusApp && !window.PluginInterfaceController) {
                const controllers = window.StimulusApp.controllers;
                for (let i = 0; i < controllers.length; i++) {
                    if (controllers[i].context.identifier === 'plugin-interface') {
                        window.PluginInterfaceController = controllers[i].constructor;
                        console.log("PluginInterfaceController exposé globalement");
                        break;
                    }
                }
            }
        });
    </script>
</body>
</html>
